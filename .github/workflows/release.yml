name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip_existing: true

  # Hosting moved off Fly.io to a self-hosted Coolify instance which deploys
  # via webhook on push to main. See docs/coolify-deploy.md. The Fly secrets
  # (FLY_API_TOKEN, FLY_API_TOKEN_PROPERTYDATA) can be removed once the Fly
  # apps are torn down.
